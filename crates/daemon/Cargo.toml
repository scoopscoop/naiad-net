[package]
name = "naiad-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
bench = false

[lints]
workspace = true

[dependencies]
naiad-core.workspace = true
naiad-db.workspace = true
naiad-indexer.workspace = true
naiad-api.workspace = true
naiad-netproto.workspace = true
naiad-plugin.workspace = true
naiad-plugin-hydrus.workspace = true
axum = { workspace = true, features = ["ws"] }
tokio.workspace = true
tokio-stream.workspace = true
image.workspace = true
jpeg-decoder.workspace = true
rayon.workspace = true
serde.workspace = true
anyhow.workspace = true
tower-http.workspace = true
rust-embed.workspace = true
toml.workspace = true
toml_edit.workspace = true
serde_ignored.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
blake3.workspace = true
tempfile.workspace = true
rusqlite.workspace = true

[dev-dependencies]
# Dev-only cycle: test-support normally depends on naiad-daemon (for
# spawn_test_daemon); these tests dev-depend back on it for fixtures. Cargo
# permits dev-dependency cycles.
naiad-test-support.workspace = true
naiad-server.workspace = true
naiad-db.workspace = true
# Test-only writer for synthetic Hydrus snapshots; the `[dependencies]` entry
# above stays featureless so normal builds keep the read-only crate read-only.
naiad-plugin-hydrus = { workspace = true, features = ["fixture"] }
serde_json.workspace = true
tower.workspace = true
hex.workspace = true
rusqlite.workspace = true
rayon.workspace = true
http-body-util = "0.1"
bytes = "1"
tokio-tungstenite = "0.29"
futures-util = "0.3"
flate2.workspace = true
