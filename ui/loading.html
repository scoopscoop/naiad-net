<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naiad</title>
    <style>
      :root {
        color-scheme: dark;
        --ink-850: #1c1a18;
        --ink-900: #151310;
        --line: #332e26;
        --line-soft: #403a30;
        --raise: #2b261e;
        --text: #ece7db;
        --text-mute: #8f8879;
        --text-faint: #6f6a5c;
        --accent: #a9b6e0;
        --err: #f0b8af;
        --err-bg: #5a2a22;
        --mono: ui-monospace, 'Cascadia Code', Consolas, 'IBM Plex Mono', monospace;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        background: var(--ink-850);
        color: var(--text);
        font-family: var(--mono);
        overflow: hidden;
      }
      .root {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 32px;
      }
      .wordmark {
        font: 500 22px/1 var(--mono);
        letter-spacing: 0.22em;
        text-transform: lowercase;
        color: var(--text);
      }
      .bar {
        position: relative;
        width: 220px;
        height: 3px;
        border-radius: 2px;
        background: var(--raise);
        overflow: hidden;
      }
      .bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        background: var(--accent);
        animation: slide 1.2s ease-in-out infinite;
      }
      /* Determinate: a real progress fraction replaces the indeterminate slide.
         `--fill` is set inline on `.bar` from loading.ts; the higher specificity
         (two classes + pseudo) wins over the base and reduced-motion rules. */
      .bar.determinate::after {
        animation: none;
        width: var(--fill, 0%);
        transition: width 240ms ease-out;
      }
      @keyframes slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      .status {
        max-width: 520px;
        min-height: 1.2em;
        text-align: center;
        font: 500 11px/1.4 var(--mono);
        color: var(--text-faint);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .quit {
        position: fixed;
        top: 8px;
        right: 8px;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--text-mute);
        font: 500 15px/1 var(--mono);
        cursor: pointer;
      }
      .quit:hover { background: var(--err-bg); color: var(--err); }
      .quit:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .error { max-width: 560px; width: 100%; }
      .error h1 {
        margin: 0 0 10px;
        font: 500 13px/1.4 var(--mono);
        color: var(--err);
      }
      .lines {
        margin: 0 0 14px;
        max-height: 220px;
        overflow-y: auto;
        padding: 10px;
        background: var(--ink-900);
        border: 1px solid var(--line);
        border-radius: 8px;
        font: 500 11px/1.5 var(--mono);
        color: var(--text-mute);
        white-space: pre-wrap;
        word-break: break-word;
      }
      .actions { display: flex; gap: 8px; justify-content: flex-end; }
      .actions button {
        height: 30px;
        padding: 0 12px;
        border: 1px solid var(--line-soft);
        border-radius: 8px;
        background: var(--raise);
        color: var(--text);
        font: 500 12px/1 var(--mono);
        cursor: pointer;
      }
      .actions button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after { animation: none; width: 100%; opacity: 0.35; }
        /* A determinate fill is position, not motion: keep it fully opaque and
           snap width changes instead of animating them. */
        .bar.determinate::after { opacity: 1; transition: none; }
      }
    </style>
  </head>
  <body>
    <!-- decorations(false): without a drag region a hung daemon leaves an
         unmovable box on screen. -->
    <div class="root" id="root" data-tauri-drag-region>
      <button class="quit" id="quit" type="button" aria-label="quit">×</button>
      <div class="wordmark">naiad</div>
      <div class="bar" role="progressbar" aria-label="starting the daemon"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </div>
    <script type="module" src="/src/loading.ts"></script>
  </body>
</html>
